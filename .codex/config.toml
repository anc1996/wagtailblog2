# Repository-scoped Codex configuration
disable_response_storage = false
model_catalog_json = "model-catalog.json"

[agents]
enabled = true
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "high"

[agents.astra]
description = "按明确授权承担独立分析、实现或复核任务的 Astra 子代理，不替代默认 Sol 角色"
config_file = "agents/astra.toml"
nickname_candidates = ["AstraAnalyst", "AstraEngineer"]

[agents.luna]
description = "按明确授权承担独立分析、实现或复核任务的 Luna 子代理，不替代默认 Sol 角色"
config_file = "agents/luna.toml"
nickname_candidates = ["LunaAnalyst", "LunaEngineer"]

[agents.sol]
description = "负责 Django/Wagtail 跨模块契约、事务与补偿边界及验收证据审查的架构代理"
config_file = "agents/sol.toml"
nickname_candidates = ["SolArchitect", "SolPlanner"]

[agents.gemini]
description = "在明确契约和文件范围内完成 Python/Django/Wagtail 全栈实现、定向测试及文档同步的工程代理"
config_file = "agents/gemini.toml"
nickname_candidates = ["GeminiCoder", "GeminiDocs", "GeminiTester"]

[agents.grok]
description = "以反例独立复核身份、事务、并发、补偿与测试证据并提出阻断项的只读审查代理"
config_file = "agents/grok.toml"
nickname_candidates = ["GrokReviewer", "GrokAuditor"]

[agents.opus]
description = "仅在重大契约争议、跨存储取舍或难以判断的残余风险时提供独立架构第二意见的专家"
config_file = "agents/claude-complex.toml"
nickname_candidates = ["ClaudeOpus", "OpusArchitect"]

[agents.sonnet]
description = "经明确指派处理 Wagtail 生命周期、复制别名及并发疑难缺陷并实施最小修复的工程代理"
config_file = "agents/claude-sonnet.toml"
nickname_candidates = ["ClaudeSonnet", "SonnetEngineer"]

