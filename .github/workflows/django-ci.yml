name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: django-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wagtailsoftblog_ci
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      WAGTAILBLOG_ENV: test
      DJANGO_SECRET_KEY: django-ci-not-a-production-secret
      SERVICE_HOST: 127.0.0.1
      MYSQL_NAME: wagtailsoftblog_ci
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-root-password
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      REDIS_HOST: 127.0.0.1
      REDIS_PASSWORD: ci
      MONGO_HOST: 127.0.0.1
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ACCESS_KEY: ci
      MINIO_SECRET_KEY: ci
      ELASTICSEARCH_URL: http://127.0.0.1:9200

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Inspect migration plan
        run: python manage.py migrate --plan
