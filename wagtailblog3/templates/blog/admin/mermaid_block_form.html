{% load static %}

<div class="mermaid-admin-editor" data-mermaid-modern-editor data-mermaid-prefix="{{ prefix }}">
    <div class="mermaid-admin-editor__header">
        <div>
            <strong>Mermaid 图表编辑器</strong>
            <span class="mermaid-admin-editor__status" data-mermaid-renderer-status role="status"></span>
        </div>
        <button type="button" class="button button-secondary" data-mermaid-upgrade hidden>
            升级到 Modern Mermaid
        </button>
    </div>

    <div class="mermaid-admin-editor__renderer" data-contentpath="renderer">
        {{ children.renderer.render_form }}
    </div>

    <div class="mermaid-admin-editor__view-controls" data-mermaid-view-controls hidden>
        <button type="button" class="button button-secondary" data-mermaid-display-toggle
                aria-pressed="false">全页面显示</button>
        <button type="button" class="button button-secondary" data-mermaid-pane-toggle
                aria-pressed="false">仅预览</button>
    </div>

    <div class="mermaid-admin-editor__workspace">
        <section class="mermaid-admin-editor__mode mermaid-admin-editor__mode--modern"
                 data-mermaid-mode="modern"
                 aria-label="Modern Mermaid 编辑器">
            <div class="mermaid-admin-editor__frame-host" data-mermaid-editor-frame-host></div>
            <div class="mermaid-admin-editor__fallback" data-mermaid-editor-fallback hidden>
                编辑器加载失败，请刷新页面，或切换为旧版模式编辑源码。
            </div>
        </section>

        <section class="mermaid-admin-editor__mode mermaid-admin-editor__mode--legacy"
                 data-mermaid-mode="legacy"
                 aria-label="旧版 Mermaid 编辑器"
                 hidden>
            <div class="mermaid-admin-editor__legacy-source" data-contentpath="code">
                <div class="mermaid-admin-editor__source-heading">Mermaid 源代码</div>
                {{ children.code.render_form }}
                <p class="mermaid-admin-editor__hint">旧版模式保留源码与实时预览，历史内容不会被自动改写。</p>
            </div>
            <div class="mermaid-admin-editor__legacy-preview">
                <div class="mermaid-admin-editor__source-heading">实时预览</div>
                <div class="mermaid-admin-editor__legacy-canvas" data-mermaid-legacy-preview>
                    <span class="mermaid-admin-editor__legacy-placeholder" data-mermaid-legacy-placeholder>
                        输入代码后将在此处渲染。
                    </span>
                    <div class="mermaid-admin-editor__legacy-output" data-mermaid-legacy-output></div>
                    <div class="mermaid-admin-editor__legacy-error" data-mermaid-legacy-error hidden></div>
                </div>
            </div>
        </section>
    </div>
</div>

<link rel="stylesheet" href="{% static 'blog/css/modern-mermaid-admin.css' %}?v=20260814-8">
<script src="{% static 'blog/js/modern-mermaid-wagtail-bridge.js' %}?v=20260814-10" defer></script>
