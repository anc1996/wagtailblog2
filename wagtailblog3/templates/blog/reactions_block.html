{% load static blog_tags wagtailcore_tags %}
{% if page.pk %}
<div class="reaction-buttons"
     data-page-id="{{ page.id }}"
     data-action-url="{% url 'blog:toggle_reaction' page.id %}">

    {% for reaction in page.get_reactions %}
        <button
            class="reaction-btn {% if reaction.id == user_reaction %}active{% endif %}"
            data-reaction-id="{{ reaction.id }}"
            title="{{ reaction.name }}"
            type="button"
        >
            <i class="{{ reaction.icon|ensure_fa_prefix }}" aria-hidden="true"></i>
            <span class="reaction-name">{{ reaction.name }}</span>
            <span class="count">{{ reaction.count }}</span>
        </button>
    {% endfor %}
</div>

{% else %}

{# 预览模式下显示占位提示 #}
<div class="reaction-buttons reaction-preview-placeholder">
    <p class="preview-notice">
        <i class="fa fa-info-circle"></i>
        文章反应功能将在发布后激活
    </p>
</div>

{% endif %}
