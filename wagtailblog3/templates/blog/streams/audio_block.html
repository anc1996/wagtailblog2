{% if value %}
<article class="custom-audio-block-wrapper" data-audio-player data-audio-title="{{ value.title|default:'音频'|escape }}">
    <div class="custom-audio-header">
        <span class="custom-audio-icon" aria-hidden="true">
            <i class="fa fa-music"></i>
        </span>
        <div class="custom-audio-heading">
            <span class="custom-audio-title">{{ value.title|default:'音频' }}</span>
            <span class="custom-audio-meta">音频文件</span>
        </div>
    </div>

    <div class="custom-audio-player-container">
        <audio preload="metadata" aria-label="{{ value.title|default:'音频'|escape }}">
            <source src="{{ value.url }}" type="audio/mpeg">
            <p>
                你的浏览器不支持增强音频播放器。
                <a href="{{ value.url }}" download>点击这里下载音频</a>
            </p>
        </audio>
    </div>
</article>
{% else %}
<div class="audio-placeholder" role="status">
    <i class="fa fa-music fa-3x" aria-hidden="true"></i>
    <p>音频文件不可用</p>
</div>
{% endif %}
