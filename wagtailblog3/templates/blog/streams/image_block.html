{% load wagtailimages_tags %}

{% if value %}
    <figure class="content-image{% if value.width > value.height %} content-image--landscape{% elif value.height > value.width %} content-image--portrait{% else %} content-image--square{% endif %}"
            data-content-image>
        <div class="content-image__media">
            <a class="content-image__link"
               href="{% image_url value 'original' %}"
               data-pswp-item
               data-pswp-width="{{ value.width }}"
               data-pswp-height="{{ value.height }}"
               data-pswp-caption="{{ value.caption|default:value.title }}"
               aria-label="查看大图：{{ value.caption|default:value.title }}">
                <img class="content-image__img"
                     src="{{ value.file.url }}"
                     width="{{ value.width }}"
                     height="{{ value.height }}"
                     alt="{{ value.caption|default:value.title }}"
                     loading="lazy"
                     decoding="async">
                <span class="content-image__zoom" aria-hidden="true">
                    <i class="fa fa-search-plus"></i>
                </span>
            </a>
        </div>

        {% if value.caption or value.title %}
            <figcaption class="content-image__caption">
                <span class="content-image__caption-mark" aria-hidden="true">
                    <i class="fa fa-image"></i>
                </span>
                <span class="content-image__caption-text">{{ value.caption|default:value.title }}</span>
                <a class="content-image__original"
                   href="{% image_url value 'original' %}"
                   target="_blank"
                   rel="noopener noreferrer"
                   title="在新窗口查看原图"
                   aria-label="在新窗口查看原图：{{ value.caption|default:value.title }}">
                    <i class="fa fa-external-link" aria-hidden="true"></i>
                    <span>查看原图</span>
                </a>
            </figcaption>
        {% endif %}
    </figure>
{% else %}
    <div class="content-image-placeholder" role="status">
        <i class="fa fa-image" aria-hidden="true"></i>
        <span>图片暂时无法显示</span>
    </div>
{% endif %}
