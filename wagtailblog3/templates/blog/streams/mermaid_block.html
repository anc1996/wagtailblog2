<section class="mermaid-diagram-wrapper {% if value.renderer == 'modern-v11.12' %}mermaid-diagram-wrapper--modern{% else %}mermaid-diagram-wrapper--legacy{% endif %}"
         data-mermaid-block
         data-mermaid-state="idle"
         data-mermaid-renderer="{{ value.renderer|default:'legacy-v11-current' }}"
         aria-label="{% if value.renderer == 'modern-v11.12' %}Modern Mermaid 11.12 图表{% else %}旧版 Mermaid 图表{% endif %}">
    <header class="mermaid-header">
        <div class="mermaid-heading">
            <i class="fa fa-sitemap" aria-hidden="true"></i>
            <span>Mermaid 图表</span>
            <span class="mermaid-renderer-badge" data-mermaid-renderer-badge>
                {% if value.renderer == 'modern-v11.12' %}Modern Mermaid 11.12{% else %}旧版兼容{% endif %}
            </span>
        </div>
        <button class="mermaid-icon-button mermaid-collapse-button"
                type="button"
                data-mermaid-action="collapse"
                aria-expanded="true"
                title="折叠图表"
                aria-label="折叠图表">
            <i class="fa fa-chevron-up" aria-hidden="true"></i>
        </button>
    </header>

    <div class="mermaid-content" data-mermaid-content>
        <div class="mermaid-toolbar" role="toolbar" aria-label="图表工具">
            <div class="mermaid-toolbar-group" aria-label="缩放控制">
                <button class="mermaid-icon-button" type="button" data-mermaid-action="zoom-out" title="缩小" aria-label="缩小">
                    <i class="fa fa-search-minus" aria-hidden="true"></i>
                </button>
                <button class="mermaid-icon-button" type="button" data-mermaid-action="zoom-in" title="放大" aria-label="放大">
                    <i class="fa fa-search-plus" aria-hidden="true"></i>
                </button>
                <button class="mermaid-icon-button" type="button" data-mermaid-action="fit" title="适应窗口" aria-label="适应窗口">
                    <i class="fa fa-crosshairs" aria-hidden="true"></i>
                </button>
                <span class="mermaid-zoom-level" data-mermaid-zoom aria-live="polite">100%</span>
            </div>

            <div class="mermaid-toolbar-group mermaid-toolbar-group--actions">
                <button class="mermaid-icon-button" type="button" data-mermaid-action="source" title="查看源码" aria-label="查看源码">
                    <i class="fa fa-code" aria-hidden="true"></i>
                </button>
                <button class="mermaid-icon-button" type="button" data-mermaid-action="download" title="下载 SVG" aria-label="下载 SVG">
                    <i class="fa fa-download" aria-hidden="true"></i>
                </button>
                <button class="mermaid-icon-button" type="button" data-mermaid-action="theme" aria-pressed="false" title="切换到暗色主题" aria-label="切换到暗色主题">
                    <i class="fa fa-moon-o" aria-hidden="true"></i>
                </button>
                <button class="mermaid-icon-button" type="button" data-mermaid-action="fullscreen" title="全屏查看" aria-label="全屏查看">
                    <i class="fa fa-arrows-alt" aria-hidden="true"></i>
                </button>
            </div>
        </div>

        <details class="mermaid-source-panel" data-mermaid-source-panel>
            <summary>Mermaid 源码</summary>
            <div class="mermaid-source-content">
                <pre><code>{{ value.code }}</code></pre>
                <button class="mermaid-copy-button" type="button" data-mermaid-action="copy-source">
                    <i class="fa fa-copy" aria-hidden="true"></i>
                    <span>复制源码</span>
                </button>
            </div>
        </details>

        <div class="mermaid-chart-container"
             data-mermaid-viewport
             tabindex="0"
             aria-label="Mermaid 图表画布">
            <textarea class="mermaid-raw-source" hidden>{{ value.code }}</textarea>
            <div class="mermaid-status" data-mermaid-status role="status" aria-live="polite">
                <i class="fa fa-circle-o-notch fa-spin" aria-hidden="true"></i>
                <span data-mermaid-status-text>正在渲染图表</span>
            </div>
            <div class="mermaid-error" data-mermaid-error role="alert" hidden>
                <i class="fa fa-exclamation-circle" aria-hidden="true"></i>
                <span data-mermaid-error-text>图表暂时无法显示，请检查 Mermaid 语法。</span>
            </div>
            <div class="mermaid-inner" data-mermaid-inner></div>
        </div>
    </div>
</section>
