<div class="guide-code-card">
    {% if value.caption or self.caption %}
        <div class="guide-code-caption">
            <span class="guide-code-filename">{{ value.caption|default:self.caption }}</span>
            <span class="guide-code-lang-badge">{{ value.language|default:self.language }}</span>
        </div>
    {% endif %}
    <div class="guide-code-wrapper">
        <button type="button" class="guide-code-copy-btn" aria-label="复制代码" title="复制代码" onclick="if(navigator.clipboard){navigator.clipboard.writeText(this.nextElementSibling.innerText);this.innerText='已复制';setTimeout(()=>this.innerText='复制',2000);}">复制</button>
        <pre class="guide-code-pre"><code class="language-{{ value.language|default:self.language }}">{{ value.code|default:self.code }}</code></pre>
    </div>
</div>
