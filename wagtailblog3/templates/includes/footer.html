{% load navigation_tags %}

<!--wagtailblog3/templates/includes/footer.html-->

<footer>

    <section class="subscribe-section" aria-labelledby="rss-subscribe-title">
        <div class="auto-container">
            <h2 id="rss-subscribe-title">订阅博客更新</h2>
            <p class="text">使用 RSS 阅读器获取最新文章，无需注册或提供邮箱。</p>
            <div class="subscribe-links" aria-label="订阅方式">
                <a class="theme-btn subscribe-rss-link" href="{% url 'blog_feed:rss' %}">
                    <span class="icon fa fa-rss" aria-hidden="true"></span>
                    <span>RSS 订阅</span>
                </a>
                <a class="subscribe-atom-link" href="{% url 'blog_feed:atom' %}">Atom</a>
            </div>
        </div>
    </section>
    {% get_navigation_social_links as social_links %}
    {% if social_links %}
        <section class="social-boxed text-center" aria-label="社交链接">
            <p class="social-boxed__label">关注我：</p>
            <ul class="social-icon-two">
                {% for social_link in social_links %}
                    <li>
                        <a
                            href="{{ social_link.url }}"
                            target="_blank"
                            rel="noopener noreferrer"
                            title="{{ social_link.label }}"
                            aria-label="{{ social_link.label }}"
                        >
                            <span class="footer-social-icon footer-social-icon--{{ social_link.icon_name }}" aria-hidden="true"></span>
                        </a>
                    </li>
                {% endfor %}
            </ul>
        </section>
    {% endif %}

    <div class="main-footer">
    {#  获取页脚内容：在base/naviagtion_tags.py #}
    {% get_footer_text %}
    </div>
</footer>
