{% load wagtailcore_tags wagtailimages_tags %}

<section class="portfolio-project-card" aria-labelledby="portfolio-card-{{ block.id }}">
    <div class="portfolio-project-grid{% if not self.image %} portfolio-project-grid--text-only{% endif %}">
        {% if self.image %}
            <figure class="portfolio-project-media">
                {% image self.image width-900 as card_img %}
                <img src="{{ card_img.url }}" alt="{{ card_img.alt|default:self.heading }}" width="{{ card_img.width }}" height="{{ card_img.height }}">
            </figure>
        {% endif %}
        <div class="portfolio-project-copy">
            <span class="portfolio-section-label">PROJECT CASE</span>
            <h2 id="portfolio-card-{{ block.id }}">{{ self.heading }}</h2>
            <div class="portfolio-richtext">{{ self.text|richtext }}</div>
        </div>
    </div>
</section>
